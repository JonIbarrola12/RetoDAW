<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados de la búsqueda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .contenedor {
            text-align: center;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
            max-width: 1400px; 
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            white-space: nowrap; 
        }

        th {
            background-color: #eaeaea;
        }

        .col-check { width: 60px; }
        .col-cantidad { width: 100px; }
        .col-isbn { width: 180px; }
        .col-titulo { width: 300px; }
        .col-autor { width: 220px; }
        .col-categoria { width: 220px; }
        .col-editorial { width: 220px; }
        .col-precio { width: 140px; }

        input[type="number"] {
            width: 70px;
            text-align: center;
        }

        .boton {
            margin-top: 20px;
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>RESULTADOS DE LA BÚSQUEDA</h1>

    <table>
        <thead>
            <tr>
                <th class="col-check"></th>
                <th class="col-cantidad">Cantidad</th>
                <th class="col-isbn">ISBN</th>
                <th class="col-titulo">Título</th>
                <th class="col-autor">Autor</th>
                <th class="col-categoria">Categoría</th>
                <th class="col-editorial">Editorial</th>
                <th class="col-precio">Precio / Unidad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="col-check">
                    <input type="checkbox" name="libro[]">
                </td>
                <td class="col-cantidad">
                    <input type="number" min="1" value="1">
                </td>
                <td class="col-isbn">978-84-376-0494-7</td>
                <td class="col-titulo">Don Quijote de la Mancha</td>
                <td class="col-autor">Miguel de Cervantes</td>
                <td class="col-categoria">Literatura clásica</td>
                <td class="col-editorial">Editorial Planeta</td>
                <td class="col-precio">19,95 €</td>
            </tr>
        </tbody>
    </table>
    <a href="selecionarlibro.html">
    <button class="boton">Seleccionar</button>
    </a>
</div>

</body>
</html>
