<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de compra y datos del comprador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .contenedor {
            width: 95%;
            max-width: 1200px;
            margin: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto 20px auto;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #eaeaea;
        }

        input[readonly] {
            width: 60px;
            text-align: center;
            border: none;
            background-color: #f0f0f0;
        }

        .resumen {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            width: 150px;
            text-align: right;
            font-weight: bold;
        }

        .form-group input {
            width: 250px; /* Recuadro moderado */
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .tarjeta {
            text-transform: uppercase;
            font-weight: bold;
            color: #ff0000;
        }

        .botones {
            text-align: center;
            margin-bottom: 50px;
        }

        .boton {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            color: white;
        }

        .volver {
            background-color: #ffc107;
            color: #000;
        }

        .seleccionar {
            background-color: #007bff;
        }

        .boton:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>EL ESTADO DE SU CARRITO DE COMPRA ES</h1>

    <table>
        <thead>
            <tr>
                <th>Cantidad</th>
                <th>ISBN</th>
                <th>Título</th>
                <th>Autor</th>
                <th>Categoría</th>
                <th>Editorial</th>
                <th>Precio / Unidad</th>
                <th>Precio Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" value="2" readonly></td>
                <td>978-84-376-0494-7</td>
                <td>Don Quijote de la Mancha</td>
                <td>Miguel de Cervantes</td>
                <td>Literatura clásica</td>
                <td>Editorial Planeta</td>
                <td>19,95 €</td>
                <td>39,90 €</td>
            </tr>
        </tbody>
    </table>

    <div class="resumen">
        Total compra: 39,90 €
    </div>

    <h1>INTRODUZCA DATOS DEL COMPRADOR</h1>

    <form>
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="apellido1">Primer Apellido:</label>
            <input type="text" id="apellido1" name="apellido1" required>
        </div>

        <div class="form-group">
            <label for="apellido2">Segundo Apellido:</label>
            <input type="text" id="apellido2" name="apellido2" required>
        </div>

        <div class="form-group">
            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" required>
        </div>

        <div class="form-group">
            <label for="tarjeta">Tarjeta de Crédito:</label>
            <input type="text" id="tarjeta" name="tarjeta" class="tarjeta" placeholder="XXXX-XXXX-XXXX-XXXX" required>
        </div>
    </form>

    <div class="botones">
    <a href="confirmacioncompra.html">
    <button
        style="
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        ">
        Realizar compra
    </button>
</a>
        <button class="boton volver">Volver atras</button>
        <a href="menubuscarlibros.html">
        <button class="boton seleccionar">Seleccionar más libros</button>
        </a>
    </div>
</div>

</body>
</html>
