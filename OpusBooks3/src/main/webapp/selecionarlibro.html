<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        .contenedor {
            text-align: center;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
            max-width: 1400px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #eaeaea;
        }

        input[type="number"] {
            width: 70px;
            text-align: center;
        }

        .resumen {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .botones {
            margin-top: 20px;
        }

        .boton {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            color: white;
        }

        .comprar {
            background-color: #28a745;
        }

        .eliminar {
            background-color: #dc3545;
        }

        .seguir {
            background-color: #007bff;
        }

        .boton:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>EL ESTADO DE SU CARRITO DE COMPRA ES</h1>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>Cantidad</th>
                <th>ISBN</th>
                <th>Título</th>
                <th>Autor</th>
                <th>Categoría</th>
                <th>Editorial</th>
                <th>Precio / Unidad</th>
                <th>Precio Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <input type="checkbox">
                </td>
                <td>
                    <input type="number" min="1" value="2">
                </td>
                <td>978-84-376-0494-7</td>
                <td>Don Quijote de la Mancha</td>
                <td>Miguel de Cervantes</td>
                <td>Literatura clásica</td>
                <td>Editorial Planeta</td>
                <td>19,95 €</td>
                <td>39,90 €</td>
            </tr>
        </tbody>
    </table>

    <div class="resumen">
        Total compra: 39,90 €
    </div>

    <div class="botones">
        <a href="validarcompra.html">
        <button class="boton comprar">Realizar compra</button>
        </a>
        <button class="boton eliminar">Quitar del carrito</button>
        <a href="menubuscarlibros.html">
        <button class="boton seguir">Seleccionar más libros</button>
        </a>
    </div>
</div>

</body>
</html>
