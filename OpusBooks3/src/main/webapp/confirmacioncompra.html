<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmación</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            text-align: center;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            cursor: pointer;
            background-color: #f2f2f2;
        }

        button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>ATENCIÓN</h1>
        <p><strong>Su compra se ha realizado perfectamente</strong></p>
        <button>Aceptar</button>
    </div>

</body>
</html>
